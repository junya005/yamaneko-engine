name: 新機能提案
description: 新しい機能や改善案の提案はこちら
title: "[Feature]: "
labels:
  - feature
body:
  - type: markdown
    attributes:
      value: |
        新機能の提案ありがとうございます。価値と実装イメージがわかるように記載してください。
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: 現状の困りごとや背景を説明してください。
      placeholder: 例）シーン切替時のロード時間が長く、待ち時間が目立つ
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案内容
      description: どのような機能を追加・改善したいか記載してください。
      placeholder: 例）非同期リソースローダーを導入し、ロード中UIを表示する
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: 期待される効果
      description: ユーザー・開発者にとってのメリット
      placeholder: 例）体感待ち時間を短縮し、UXを向上できる
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案・補足
      description: 他案や懸念点があれば記載してください。
      placeholder: 例）事前ロード対象を設定ファイルで制御する案も検討可能
  - type: checkboxes
    id: agreement
    attributes:
      label: 確認事項
      options:
        - label: 既存Issueに同様の提案がないことを確認しました
          required: true

