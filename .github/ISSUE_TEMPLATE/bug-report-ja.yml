name: バグ報告
description: 不具合の報告はこちら
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        バグ報告ありがとうございます。再現と調査に必要な情報の入力をお願いします。
  - type: checkboxes
    id: preflight
    attributes:
      label: 事前確認
      options:
        - label: 既存のIssueで同様の報告がないことを確認しました
          required: true
        - label: 最新のmainブランチ（または最新リリース）で再現確認しました
          required: true
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: どのような不具合かを簡潔に記載してください。
      placeholder: 例）起動直後にウィンドウが閉じる
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: できるだけ具体的に手順を記載してください。
      placeholder: |
        1. 〜を開く
        2. 〜を実行する
        3. 〜になる
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待される結果
      placeholder: 例）正常に画面が表示される
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の結果
      placeholder: 例）アプリがクラッシュし、エラーダイアログが表示される
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 実行環境
      description: OS、GPU、ドライバ、ビルド構成など
      placeholder: 例）Windows 11 / RTX 3060 / Driver 566.xx / VS2022 x64
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: 対象バージョン / コミット
      description: タグ名、リリース名、またはコミットSHA
      placeholder: 例）v0.2.1 / a1b2c3d
  - type: textarea
    id: logs
    attributes:
      label: ログ・スクリーンショット
      description: エラーログやスクリーンショットがあれば添付してください。
      render: shell
