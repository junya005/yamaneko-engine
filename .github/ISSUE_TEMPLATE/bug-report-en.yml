name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide enough detail to reproduce and investigate.
  - type: checkboxes
    id: preflight
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
        - label: I reproduced this on the latest main branch (or latest release)
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the bug.
      placeholder: e.g. The window closes immediately after startup
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide clear, sequential steps.
      placeholder: |
        1. Open ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: e.g. The application should open the main screen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: e.g. The app crashes with an error dialog
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, GPU, driver, build configuration, etc.
      placeholder: e.g. Windows 11 / RTX 3060 / Driver 566.xx / VS2022 x64
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Version / Commit
      description: Tag, release name, or commit SHA
      placeholder: e.g. v0.2.1 / a1b2c3d
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Attach error logs or screenshots if available.
      render: shell

